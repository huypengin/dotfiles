theme = "noctalia"

[editor]
line-number = "relative"
end-of-line-diagnostics = "hint"
inline-diagnostics.cursor-line = "warning"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.soft-wrap]
enable = true
max-wrap = 25
max-indent-retain = 0

[keys.normal.space]
"." = ":toggle-option file-picker.git-ignore"
"h" = ":toggle-option file-picker.hidden"
