include current-theme.conf

# Font
font_family JetBrainsMono Nerd Font Mono
font_size 14.0

# Window settings
remember_window_size  no
initial_window_width  960
initial_window_height 720

window_padding_width 5 10

background_opacity 0.8

background_blur 1

# Windows layout
enabled_layouts splits,stack

# Keybindings
clear_all_shortcuts yes

## Create tab in current working directory
map ctrl+t new_tab_with_cwd

## Split windows in current working directory
map ctrl+left_bracket launch --location=hsplit --cwd=current
map ctrl+right_bracket launch --location=vsplit --cwd=current

## Tabs navigation
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

## Windows navigation
map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+j neighboring_window up
map ctrl+shift+k neighboring_window down

## Close windows/tabs
map ctrl+q close_window
map ctrl+shift+q close_tab

## Zoom
map ctrl+z toggle_layout stack

include themes/noctalia.conf
